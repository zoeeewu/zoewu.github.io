{{ define "main" }}
<section class="page-hero">
  <div class="shell">
    <h1>{{ .Title }}</h1>
  </div>
</section>

<section class="shell notes-index" aria-label="Personal notes">
  <ul class="personal-notes-list">
    {{ range .RegularPages.ByDate.Reverse }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</section>
{{ end }}
